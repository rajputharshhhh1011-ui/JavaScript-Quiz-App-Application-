<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive JavaScript quiz application built with HTML, CSS and JavaScript.">
  <title>JavaScript Quiz App | Adnan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle colour theme">🌙 Dark Mode</button>

  <main class="quiz-container">
    <header class="app-heading">
      <p class="eyebrow">TEST YOUR KNOWLEDGE</p>
      <h1>JavaScript Quiz App</h1>
      <p class="subtitle">Practice web development concepts, one question at a time.</p>
    </header>

    <section id="quiz-screen" aria-live="polite">
      <div class="quiz-header">
        <span id="question-number">Question 1 of 10</span>
        <span id="score">Score: 0</span>
      </div>

      <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress"></div>
      </div>

      <p class="question-label">YOUR QUESTION</p>
      <h2 id="question">Question will appear here</h2>
      <div id="answer-buttons" class="answer-list"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <div class="quiz-actions">
        <button id="next-btn" class="primary-btn" type="button" disabled>Next Question →</button>
      </div>
    </section>

    <section id="result-screen" class="hidden" aria-live="polite"></section>

    <footer class="app-footer">
      <span>Built with HTML · CSS · JavaScript</span>
      <span>Project by Md Adnan Ashraf</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
